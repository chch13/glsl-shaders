name: JohnGate R4 Validation Receipt
on:
  workflow_run:
    workflows: ['JohnGate R4 Exact Windows Validation']
    types: [completed]
permissions:
  contents: write
jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write validation receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          cat > validation/JG_R4_RESULT.txt <<EOF
          workflow=JohnGate R4 Exact Windows Validation
          run_id=${{ github.event.workflow_run.id }}
          head_sha=${{ github.event.workflow_run.head_sha }}
          conclusion=${{ github.event.workflow_run.conclusion }}
          event=${{ github.event.workflow_run.event }}
          updated_at=${{ github.event.workflow_run.updated_at }}
          EOF
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add validation/JG_R4_RESULT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record JohnGate R4 Windows validation result [skip ci]'
          git push
