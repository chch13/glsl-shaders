name: JohnGate R3 Sanitized Exact Install Validation
on:
  push:
    paths:
      - '.github/workflows/johngate-r3-generic-windows-validation.yml'
      - 'validation/johngate-r3-sanitized-part0.txt'
      - 'validation/johngate-r3-sanitized-part1.txt'
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct sanitized package and run exact installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function U([string]$b){[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($b))}
          $parts=@('.\validation\johngate-r3-sanitized-part0.txt','.\validation\johngate-r3-sanitized-part1.txt')
          $b64=($parts|ForEach-Object{Get-Content -LiteralPath $_ -Raw}).Trim()
          $zip=Join-Path $env:RUNNER_TEMP 'JOHN_GATE_R3_SANITIZED_WINTEST.zip'
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
          $sha=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '6fd3e66e1d504cf2a8a40ed4018762fdc9631e2d8435e4bae4c903d5eda7f9a6'){throw ('SANITIZED_ZIP_SHA_FAIL '+$sha)}

          $hbase=Join-Path $env:RUNNER_TEMP 'JG Sanitized H Drive'
          New-Item -ItemType Directory -Path $hbase -Force|Out-Null
          subst H: $hbase
          try {
            $stage=U 'SDpcSkcgVGVzdFzku67mg7Pjg57jgrfjg7Nc44K444On44Oz44OA44Km44Oz44Ot44O844OJ566h55CG5aC0XOmVt+OBhCDjg5HjgrnvvIjoqabpqJPvvIlccGFja2FnZQ=='
            $top=U 'SDpcSkcgVGVzdFzku67mg7Pjg57jgrfjg7M='
            $program=U 'SDpcSkcgVGVzdFzku67mg7Pjg57jgrfjg7NcSm9obkdhdGU='
            $download=U 'SDpcSkcgVGVzdFzku67mg7Pjg57jgrfjg7Nc44K444On44Oz44OA44Km44Oz44Ot44O844OJ566h55CG5aC0'
            New-Item -ItemType Directory -Path $stage -Force|Out-Null
            Expand-Archive -LiteralPath $zip -DestinationPath $stage -Force
            $entry=Get-ChildItem -LiteralPath $stage -Filter INSTALL_TO_H.bat -Recurse -File|Select-Object -First 1
            if($null -eq $entry){throw 'INSTALL_ENTRY_NOT_FOUND'}

            $old=$program
            New-Item -ItemType Directory -Path $old -Force|Out-Null
            'OLD_INSTALL_SENTINEL'|Set-Content -LiteralPath (Join-Path $old 'OLD_SENTINEL.txt') -Encoding ASCII
            '@echo off'|Set-Content -LiteralPath (Join-Path $old 'START.bat') -Encoding ASCII
            '@echo off'|Set-Content -LiteralPath (Join-Path $old 'FIRST_SETUP.bat') -Encoding ASCII
            '@echo off'|Set-Content -LiteralPath (Join-Path $old 'SELFTEST.bat') -Encoding ASCII
            $ws=New-Object -ComObject WScript.Shell
            foreach($d in @(@('JOHN_GATE.lnk','START.bat'),@('JOHN_GATE_FIRST_SETUP.lnk','FIRST_SETUP.bat'),@('JOHN_GATE_SELFTEST.lnk','SELFTEST.bat'))){
              $lnk=Join-Path $top $d[0];$s=$ws.CreateShortcut($lnk);$s.TargetPath=(Join-Path $old $d[1]);$s.WorkingDirectory=$old;$s.Save()
            }

            & cmd.exe /d /c ('call "'+$entry.FullName+'"')
            if($LASTEXITCODE -ne 0){throw ('INSTALL_BAT_EXIT='+$LASTEXITCODE)}

            $receiptPath=Join-Path $program '_Output\INSTALL_RECEIPT.json'
            if(-not(Test-Path -LiteralPath $receiptPath)){throw 'INSTALL_RECEIPT_MISSING'}
            $r=Get-Content -LiteralPath $receiptPath -Raw -Encoding UTF8|ConvertFrom-Json
            if([string]$r.evidence -ne 'FIXTURE_BEHAVIOR_PASS_CORE_OFFLINE'){throw ('EVIDENCE_FAIL '+[string]$r.evidence)}
            if([string]$r.gh_version -ne '2.97.0'){throw 'RECEIPT_GH_VERSION_FAIL'}
            $gh=Join-Path $program 'tools\gh\bin\gh.exe'
            if(-not(Test-Path -LiteralPath $gh)){throw 'INSTALLED_GH_MISSING'}
            $gv=& $gh version 2>&1
            if(($gv -join "`n") -notmatch 'gh version 2\.97\.0'){throw 'INSTALLED_GH_VERSION_FAIL'}

            if(Test-Path -LiteralPath (Join-Path $download 'JohnGateR3InstallTemp')){throw 'INSTALL_TEMP_NOT_CLEANED'}
            if(Test-Path -LiteralPath (Join-Path $download 'JohnGateR3Candidate')){throw 'CANDIDATE_NOT_CLEANED'}
            $rollback=Join-Path $download 'JohnGate_PreR3_Rollback'
            if(-not(Test-Path -LiteralPath (Join-Path $rollback 'Program\OLD_SENTINEL.txt'))){throw 'OLD_PROGRAM_ROLLBACK_MISSING'}
            foreach($n in @('JOHN_GATE.lnk','JOHN_GATE_FIRST_SETUP.lnk','JOHN_GATE_SELFTEST.lnk')){
              if(-not(Test-Path -LiteralPath (Join-Path $rollback ('Links\'+$n)))){throw ('OLD_LINK_ROLLBACK_MISSING '+$n)}
              if(-not(Test-Path -LiteralPath (Join-Path $top $n))){throw ('NEW_LINK_MISSING '+$n)}
            }

            $self=Get-Content -LiteralPath (Join-Path $program '_Output\SELFTEST_RECEIPT.json') -Raw -Encoding UTF8|ConvertFrom-Json
            if([int]$self.failed -ne 0){throw ('SELFTEST_FAILURE_COUNT='+[int]$self.failed)}
            Write-Output ('SANITIZED_EXACT_INSTALL_PASS sha='+$sha)
            Write-Output ('INSTALL_EVIDENCE='+[string]$r.evidence)
            Write-Output ('SELFTEST_PASSED='+[int]$self.passed)
          }
          finally {
            subst H: /d | Out-Null
          }
