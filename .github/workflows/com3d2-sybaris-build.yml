name: COM3D2 Sybaris PMX Build

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and validate hardened Sybaris DLL
        shell: powershell
        run: .\com3d2-build\Build-R4.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: COM3D2_SYBARIS_MODEL_EXPORT_R4_BUILD
          path: COM3D2_SYBARIS_MODEL_EXPORT_R4_BUILD.zip
          if-no-files-found: error
          retention-days: 7

  audit-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audit source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Linux auditor
        run: >-
          dotnet publish com3d2-audit/Com3d2MetadataAudit.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o audit-publish

      - name: Smoke-test command line
        run: |
          set +e
          ./audit-publish/Com3d2MetadataAudit
          code=$?
          set -e
          test "$code" -eq 2

      - name: Upload metadata auditor
        uses: actions/upload-artifact@v4
        with:
          name: COM3D2_METADATA_AUDIT_LINUX_X64
          path: audit-publish/Com3d2MetadataAudit
          if-no-files-found: error
          retention-days: 7
